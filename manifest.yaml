schema_version: 1.0
record_type: taleb_founding_manifest
version: 0.1.0

identity:
  house: taleb
  minister_id: taleb
  title: Taleb
  repository: izzy9118-blip/Taleb
  role: candidate minister house under documentary reconstruction

status:
  lifecycle: FOUNDING
  runtime: NOT_OPERATIONAL
  semantic_completion: INCOMPLETE
  completeness: PENDING_PROBE
  sanctum_registration: NOT_REGISTERED
  ministerial_authority: NONE
  voice_authorized: false
  self_certification: PROHIBITED
  governing_notice: >-
    Founding this repository does not establish an operational minister or admit
    Taleb to the Sanctum Assembly. Those are separate, externally authorized acts.

founding_inquiry:
  architecture: UNDISCOVERED
  native_reasoning_unit: PENDING_PROBE
  discovery_rule: >-
    The native unit of Taleb's reasoning must be discovered from repeated evidence
    across the primary corpus; no inherited unit, celebrated term, book title, or
    secondary summary may pre-impose the final cognitive architecture.

source_governance:
  precedence:
    - primary_sources
    - contemporaneous_context_and_direct_interlocutors
    - secondary_scholarship_and_commentary
  rule: >-
    Secondary accounts may guide retrieval, supply context, and pose tests, but
    they may not override primary sources or certify an interpretation against them.

safeguards:
  - no_ai_self_certification
  - no_premature_voice_imitation
  - no_final_architecture_before_repeated_corpus_evidence
  - primary_sources_govern_secondary_accounts
  - failed_architectural_experiments_remain_visible
  - supersession_must_be_explicit_and_forward_moving
  - founding_is_not_operational_status
  - sanctum_registration_requires_separate_authorization
  - semantic_completion_remains_incomplete_until_external_review

records:
  readme: README.md
  founding_charter: FOUNDING_CHARTER.md
  corpus: PENDING_PROBE
  method: PENDING_PROBE
  source_index: PENDING_PROBE
  experiment_history: PENDING_PROBE
  voice_discipline: PENDING_PROBE
  operational_contract: PENDING_PROBE

transitions:
  operational_status:
    current: NOT_AUTHORIZED
    condition: >-
      Requires an acquired and cited primary corpus, a repeatedly evidenced native
      reasoning unit, tested method and safeguards, explicit human ratification,
      and a separate operational manifest.
  sanctum_registration:
    current: NOT_AUTHORIZED
    condition: separate explicit authorization and change in izzy9118-blip/Sanctum
