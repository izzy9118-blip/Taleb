schema_version: 1.0
record_type: taleb_founding_manifest
version: 0.6.0

identity:
  house: taleb
  minister_id: taleb
  title: Taleb
  repository: izzy9118-blip/Taleb
  role: founded minister house under documentary reconstruction

status:
  lifecycle: FOUNDING
  runtime: NOT_OPERATIONAL
  semantic_completion: INCOMPLETE
  completeness: PENDING_PROBE
  sanctum_registration: NOT_REGISTERED
  ministerial_authority: NONE
  voice_authorized: false
  self_certification: PROHIBITED
  governing_notice: >-
    Founding this repository does not establish an operational minister or admit
    Taleb to the Sanctum Assembly. Those are separate, externally authorized acts.

founding_inquiry:
  architecture: UNDISCOVERED
  native_reasoning_unit: PENDING_PROBE
  discovery_rule: >-
    The native unit of Taleb's reasoning must be discovered from repeated evidence
    across the primary corpus; no inherited unit, celebrated term, book title, or
    secondary summary may pre-impose the final cognitive architecture.

required_capabilities:
  market_analysis:
    status: OWNER_APPROVED_FOUNDING_REQUIREMENT
    evidence_board: market/evidence-board.yaml
    architecture_effect: NONE
    live_data_connection: NOT_ESTABLISHED
    trading_or_execution: NOT_AUTHORIZED
    governing_limit: >-
      Taleb must be able to analyze markets. That required capability does not
      predeclare markets, risk, exposure, convexity, or any other term as the native
      unit of his reasoning.

source_governance:
  model: CLAIM_RELATIVE_AUTHORITY
  hierarchy: governance/source-hierarchy.yaml
  evidence_contract: contracts/evidence-record.schema.json
  admission: DIRECT_PROJECT_RELEVANCE_REQUIRED
  rule: >-
    Primary sources govern reconstruction. External material enters only when
    directly required to acquire an exact witness, establish relevant context, or
    test a specific claim. Unrelated material is ignored.

safeguards:
  - no_ai_self_certification
  - no_premature_voice_imitation
  - no_final_architecture_before_repeated_corpus_evidence
  - primary_sources_govern_reconstruction
  - unrelated_external_material_is_ignored
  - failed_architectural_experiments_remain_visible
  - supersession_must_be_explicit_and_forward_moving
  - founding_is_not_operational_status
  - sanctum_registration_requires_separate_authorization
  - semantic_completion_remains_incomplete_until_external_review

records:
  readme: README.md
  founding_charter: FOUNDING_CHARTER.md
  approved_plan_decision: governance/decisions/2026-08-17-approved-plan-phases-1-3.yaml
  founding_audit: governance/audits/2026-08-17-founding-audit.yaml
  source_hierarchy: governance/source-hierarchy.yaml
  claim_types: governance/claim-types.yaml
  source_hierarchy_tests: governance/source-hierarchy-tests.yaml
  evidence_contract: contracts/evidence-record.schema.json
  corpus: corpus/index.yaml
  works_board: corpus/works.yaml
  acquisition_queue: corpus/acquisition-queue.yaml
  work_relations: corpus/relations.yaml
  technical_work_map: corpus/technical-work-map.yaml
  market_evidence_board: market/evidence-board.yaml
  method: method/acquisition-protocol.yaml
  aphorism_reading_protocol: method/aphorism-reading-protocol.yaml
  source_index: corpus/index.yaml
  reading_index: readings/index.yaml
  experiment_history: experiments/index.yaml
  voice_discipline: PENDING_PROBE
  operational_contract: PENDING_PROBE

load_order:
  - manifest.yaml
  - FOUNDING_CHARTER.md
  - governance/decisions/2026-08-17-approved-plan-phases-1-3.yaml
  - governance/audits/2026-08-17-founding-audit.yaml
  - governance/claim-types.yaml
  - governance/source-hierarchy.yaml
  - contracts/evidence-record.schema.json
  - governance/source-hierarchy-tests.yaml
  - method/acquisition-protocol.yaml
  - corpus/index.yaml
  - corpus/works.yaml
  - corpus/acquisition-queue.yaml
  - corpus/relations.yaml
  - corpus/technical-work-map.yaml
  - market/evidence-board.yaml
  - method/aphorism-reading-protocol.yaml
  - readings/index.yaml
  - experiments/index.yaml

transitions:
  operational_status:
    current: NOT_AUTHORIZED
    condition: >-
      Requires an acquired and cited primary corpus, a repeatedly evidenced native
      reasoning unit, tested method and safeguards, explicit human ratification,
      and a separate operational manifest.
  sanctum_registration:
    current: NOT_AUTHORIZED
    condition: separate explicit authorization and change in izzy9118-blip/Sanctum
